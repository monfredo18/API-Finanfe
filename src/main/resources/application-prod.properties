# ==============================================
# Perfil de Produção (MySQL)
# ==============================================
# Ativar com: java -jar finanfe-api.jar --spring.profiles.active=prod

spring.datasource.url=jdbc:mysql://localhost:3306/finanfe_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.h2.console.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

